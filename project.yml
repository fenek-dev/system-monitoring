name: Warden
options:
  bundleIdPrefix: dev.warden
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    ARCHS: arm64
    ENABLE_HARDENED_RUNTIME: NO
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "3"
    # Debug otherwise splits the code into Warden.debug.dylib (previews); keep one binary so
    # `otool -l Contents/MacOS/Warden` shows the weak private-library loads.
    ENABLE_DEBUG_DYLIB: NO
packages:
  MonitorCore:
    path: MonitorCore
targets:
  Warden:
    type: application
    platform: macOS
    sources: [App/Sources, App/Resources]
    # Signing lives in the xcconfig (not settings.base) so Config/Local.xcconfig can override it.
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: Warden
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "15.0"
        NSAudioCaptureUsageDescription: Warden reads each app's audio so it can replay it at the volume you set.
    dependencies:
      - package: MonitorCore
        products: [MonitorModel, MonitorLive, MonitorRuntime, MonitorScreens, MonitorUIKit, MonitorExtraDim, CPrivate, MixerCore]
